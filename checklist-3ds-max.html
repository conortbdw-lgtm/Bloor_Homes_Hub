		<script>
			// Update progress counter
			function updateProgress() {
				const checkboxes = document.querySelectorAll('input[type="checkbox"]');
				const completed = document.querySelectorAll('input[type="checkbox"]:checked').length;
				document.getElementById('completed').textContent = completed;
				document.getElementById('total').textContent = checkboxes.length;
			// Save to localStorage
				saveChecklistLocal();
			}
			// Save checklist state to localStorage (for auto-save)
			function saveChecklistLocal() {
				const checkboxes = document.querySelectorAll('input[type="checkbox"]');
				const state = {};
				checkboxes.forEach(checkbox => {
					state[checkbox.id] = checkbox.checked;
				});
				localStorage.setItem('checklistState', JSON.stringify(state));
			}
			// Download checklist as .txt file
			function downloadChecklist() {
				let fileContent = "UX CHECKLIST - " + new Date().toLocaleString() + "\n";
				fileContent += "=".repeat(60) + "\n\n";

				// Get all sections
				const sections = document.querySelectorAll('.section-title');

				sections.forEach(section => {
					const sectionTitle = section.textContent.trim();
					fileContent += sectionTitle + "\n";
					fileContent += "-".repeat(40) + "\n";

					// Get the next div (the section container)
					let sectionContainer = section.nextElementSibling;

					// If it's a div with id, get all checklist items from it
					if (sectionContainer && sectionContainer.id) {
						const items = sectionContainer.querySelectorAll('.checklist-item');

						items.forEach(item => {
							const checkbox = item.querySelector('input[type="checkbox"]');
							const label = item.querySelector('label');

							if (checkbox && label) {
								const status = checkbox.checked ? "✓ DONE" : "✗ TODO";
								fileContent += `[${status}] ${label.textContent.trim()}\n`;
							}
						});
					}
					fileContent += "\n";
				});

				fileContent += "=".repeat(60) + "\n";
				fileContent += "Completed: " + document.getElementById('completed').textContent + " / " + document.getElementById('total').textContent + "\n";

				// Create and download file
				const element = document.createElement('a');
				element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(fileContent));
				element.setAttribute('download', 'checklist_' + new Date().getTime() + '.txt');
				element.style.display = 'none';
				document.body.appendChild(element);
				element.click();
				document.body.removeChild(element);
			}

			// Load checklist state from localStorage
			function loadChecklist() {
				const saved = localStorage.getItem('checklistState');
				if (saved) {
					const state = JSON.parse(saved);
					Object.keys(state).forEach(id => {
						const checkbox = document.getElementById(id);
						if (checkbox) {
							checkbox.checked = state[id];
						}
					});
				}
				updateProgress();
			}

			// Clear all checkboxes
			function clearChecklist() {
				if (confirm('Are you sure you want to clear all items?')) {
					document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
						checkbox.checked = false;
					});
					updateProgress();
				}
			}

			// Add event listeners to all checkboxes
			document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
				checkbox.addEventListener('change', updateProgress);
			});

			// Load saved state on page load
			window.addEventListener('load', loadChecklist);
		</script>
